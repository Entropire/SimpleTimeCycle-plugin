# ===============================
# Day/Night Cycle Configuration
# ===============================

# Length of the daytime in minutes.
# Minimum value: 1
# Default: 20
day-cycle-length: 20

# Length of the nighttime in minutes.
# Minimum value: 1
# Default: 10
night-cycle-length: 10

# Worlds where the custom day/night cycle is applied.
# Vanilla default worlds: world, world_nether, world_the_end
# Default: ["world"]
affected-worlds:
    - world

# ===============================
# Player Sleep Configuration
# ===============================

# Enables the player sleep feature.
# If false, players cannot sleep at all.
# Default: true
enable-player-sleep: true

# Message shown when a player tries to sleep but sleeping is disabled.
# Placeholders:
#   {player} - player's name
#   {world} - world name
# Default: "Sorry, sleeping is not allowed in this world!"
player-sleep-disabled-message: "Sorry {player}, sleeping is not allowed in {world}!"

# Percentage of players that must be sleeping to skip the night.
# 0 = no players required, 100 = all players must sleep.
# Minimum: 0, Maximum: 100
# Default: 50
player-sleep-percentage: 50

# Message shown when not enough players are sleeping to skip the night.
# Placeholders:
#   {world} - world name
#   {amount-needed} - number of players needed
#   {amount-sleeping} - number of players currently sleeping
# Default: "Not enough players are sleeping to skip night!"
player-sleep-percentage-message: "{amount-sleeping} of {amount-needed} players are sleeping in {world}!"

# Message shown when enough players are sleeping and the night is skipped.
# Placeholders same as above.
# Default: "Enough players are sleeping, night skipped!"
player-sleep-success-message: "{amount-sleeping} of {amount-needed} players are sleeping in {world}!"

# Percentage of the night to skip when enough players are sleeping.
# 0 = no night skipped, 100 = the full night is skipped.
# Minimum: 0, Maximum: 100
# Default: 50
night-skip-percentage: 50

# Message shown when a player tries to sleep, but the night has already been partially or fully skipped.
# Placeholders:
#   {world} - world name
# Default: "Night has already been skipped in {world}!"
night-already-skip-message: "Night has already been skipped in {world}!"
